<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icons/favicon-48.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="Urban Organization" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Urban Organization</title>
    <!-- Aplica o tema salvo antes da primeira pintura (sem flash). Mesma regra de useTheme. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        var dark =
          t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <!--
      Tela de abertura: só aparece no primeiro carregamento, até a primeira rota resolver
      (src/app/boot.ts a remove). Sem porcentagem: a barra é indeterminada.
    -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: #fafaf9;
        transition: opacity 220ms cubic-bezier(0.55, 0, 1, 0.45);
      }
      .dark #boot-splash {
        background: #000000;
      }
      #boot-splash[data-done] {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .boot-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        /* carregamentos rápidos nem chegam a mostrar a marca */
        animation: boot-in 320ms cubic-bezier(0.22, 1, 0.36, 1) 150ms both;
      }
      #boot-splash img {
        width: 120px;
        height: auto;
      }
      #boot-splash .boot-inverse,
      .dark #boot-splash .boot-light {
        display: none;
      }
      .dark #boot-splash .boot-inverse {
        display: block;
      }
      #boot-splash .boot-bar {
        position: relative;
        width: 96px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgb(24 24 27 / 0.08);
      }
      .dark #boot-splash .boot-bar {
        background: rgb(237 237 239 / 0.1);
      }
      #boot-splash .boot-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: #f99f11;
        animation: boot-bar 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .dark #boot-splash .boot-bar::after {
        background: #f99f11;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @keyframes boot-bar {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-mark {
          animation: none;
        }
        #boot-splash .boot-bar::after {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Carregando o Urban Organization">
      <div class="boot-mark">
        <img class="boot-light" src="/brand/urban-logo-on-light.png" alt="" />
        <img class="boot-inverse" src="/brand/urban-logo-on-dark.png" alt="" />
        <span class="boot-bar" aria-hidden="true"></span>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
