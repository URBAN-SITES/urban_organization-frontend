<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icons/favicon-48.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="Urban Organization" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- foto do fundo da abertura (também é a da tela de entrada) -->
    <link
      rel="preload"
      as="image"
      href="/images/office-executive.webp"
      type="image/webp"
      media="(min-width: 1024px)"
    />
    <link
      rel="preload"
      as="image"
      href="/images/office-executive-sm.webp"
      type="image/webp"
      media="(max-width: 1023px)"
    />
    <title>Urban Organization</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <!--
      Tela de abertura: só aparece no primeiro carregamento, até a primeira rota resolver
      (src/app/boot.ts a remove). Sem porcentagem: a barra é indeterminada.
    -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 50%, rgb(0 0 0 / 0.55), rgb(0 0 0 / 0.82) 70%),
          url('/images/office-executive.webp') 35% 50% / cover no-repeat #000000;
        color: #ffffff;
        font-family: system-ui, sans-serif;
        transition: opacity 260ms cubic-bezier(0.55, 0, 1, 0.45);
      }
      @media (max-width: 1023px) {
        #boot-splash {
          background:
            radial-gradient(circle at 50% 50%, rgb(0 0 0 / 0.55), rgb(0 0 0 / 0.82) 70%),
            url('/images/office-executive-sm.webp') 35% 50% / cover no-repeat #000000;
        }
      }
      #boot-splash[data-done] {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(720px, 140vw);
        aspect-ratio: 1;
        translate: -50% -50%;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(249 159 17 / 0.14), transparent 60%);
        animation: boot-breathe 3.2s ease-in-out infinite;
      }
      #boot-splash .boot-mark {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* carregamentos rápidos nem chegam a mostrar a marca */
        animation: boot-in 320ms cubic-bezier(0.22, 1, 0.36, 1) 150ms both;
      }
      #boot-splash img {
        width: 144px;
        height: auto;
        animation: boot-glow 2.4s ease-in-out infinite;
      }
      #boot-splash .boot-bar {
        position: relative;
        width: 160px;
        height: 3px;
        margin-top: 32px;
        overflow: hidden;
        border-radius: 3px;
        background: rgb(255 255 255 / 0.08);
      }
      #boot-splash .boot-bar::after {
        content: '';
        position: absolute;
        inset-block: 0;
        left: 0;
        width: 45%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #f99f11 40%, #ffd08a);
        box-shadow: 0 0 12px rgb(249 159 17 / 0.8);
        animation: boot-bar 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      #boot-splash .boot-text {
        margin: 24px 0 0;
        font-size: 14px;
        font-weight: 500;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @keyframes boot-bar {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(260%);
        }
      }
      @keyframes boot-glow {
        50% {
          filter: drop-shadow(0 0 14px rgb(249 159 17 / 0.35));
        }
      }
      @keyframes boot-breathe {
        50% {
          opacity: 0.6;
          scale: 0.92;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-mark,
        #boot-splash img,
        #boot-splash::before {
          animation: none;
        }
        #boot-splash .boot-bar::after {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-mark">
        <img src="/brand/urban-logo-on-dark.png" alt="Urban Organization" />
        <span class="boot-bar" aria-hidden="true"></span>
        <p class="boot-text">Verificando sua sessão...</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
